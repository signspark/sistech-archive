<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SISTECH 디자인 아카이브 (샘플)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',system-ui,sans-serif;background:#f4f5f7;color:#1c2330}
header{background:#0f1b3d;color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px}
header h1{font-size:18px;margin:0;font-weight:700}header span{opacity:.7;font-size:13px}
.badge{background:#f5b400;color:#222;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.wrap{display:flex;gap:20px;padding:20px 28px;align-items:flex-start}
aside{width:250px;flex:none;background:#fff;border-radius:10px;padding:16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;box-shadow:0 1px 3px #0001}
aside h3{font-size:12px;color:#667;margin:16px 0 6px;letter-spacing:.5px}aside h3:first-child{margin-top:0}
.chip{display:inline-block;font-size:12px;padding:4px 10px;margin:2px 2px 2px 0;border:1px solid #d5d9e2;border-radius:14px;cursor:pointer;background:#fff;user-select:none}
.chip.on{background:#0f1b3d;color:#fff;border-color:#0f1b3d}.chip small{opacity:.6;margin-left:3px}
main{flex:1;min-width:0}
.bar{display:flex;gap:10px;margin-bottom:14px}
.bar input{flex:1;padding:11px 14px;border:1px solid #d5d9e2;border-radius:8px;font-size:14px}
.bar select,.bar button{padding:0 12px;border:1px solid #d5d9e2;border-radius:8px;background:#fff;font-size:13px;cursor:pointer}
.site{background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;gap:22px;flex-wrap:wrap;font-size:13px;box-shadow:0 1px 3px #0001}
.site b{display:block;color:#889;font-size:11px;font-weight:400}.site div strong{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px #0001;transition:.15s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px #0002}
.card img{width:100%;display:block;aspect-ratio:1.414;object-fit:cover;background:#eee;border-bottom:1px solid #eee}
.card .b{padding:10px 12px}.card .t{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.tags{margin-top:6px}.tg{display:inline-block;font-size:11px;background:#eef1f7;color:#445;border-radius:4px;padding:2px 6px;margin:0 3px 3px 0}.tg.l{background:#fff3d6;color:#7a5a00}
.loc{position:absolute;left:8px;top:8px;background:#0f1b3dcc;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.pg{position:absolute;right:8px;top:8px;background:#fffd;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid #ccd}
.fav{cursor:pointer;color:#bbb;font-size:18px;line-height:1}.fav.on{color:#e0245e}
.empty{padding:60px;text-align:center;color:#889}
#modal{position:fixed;inset:0;background:#000b;display:none;z-index:9;padding:24px}
#modal.show{display:flex;gap:18px}
#mimg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
#mimg img{max-width:100%;max-height:calc(100vh - 150px);background:#fff;border-radius:6px}
.nav{margin-top:10px;display:flex;gap:6px;align-items:center;color:#fff;font-size:13px}.nav button{background:#fff2;color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:16px}
.strip{display:flex;gap:6px;margin-top:8px;max-width:100%;overflow:auto}.strip img{height:54px;max-height:54px;border:2px solid transparent;cursor:pointer;opacity:.6}.strip img.on{border-color:#f5b400;opacity:1}
#minfo{width:320px;background:#fff;border-radius:10px;padding:20px;overflow:auto;flex:none}
#minfo h2{margin:0 0 4px;font-size:20px}#minfo p{font-size:13px;line-height:1.6;color:#445}
#minfo .row{font-size:12px;color:#667;margin:12px 0 4px}
.btn{display:block;width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #0f1b3d;background:#0f1b3d;color:#fff;cursor:pointer;font-size:13px}.btn.o{background:#fff;color:#0f1b3d}
.close{position:absolute;right:20px;top:12px;color:#fff;font-size:28px;cursor:pointer}
.note{font-size:12px;color:#889;margin-top:16px;line-height:1.5}

#ftog{display:none}
@media (max-width:760px){
header{padding:12px 14px;flex-wrap:wrap;gap:6px 10px}header h1{font-size:16px}header span{font-size:12px}#cnt{margin-left:0!important;width:100%;opacity:.8}
.wrap{flex-direction:column;padding:12px;gap:12px}
aside{width:100%;position:static;max-height:none;display:none;padding:12px}
body.fopen aside{display:block}
main{width:100%}
.bar{flex-wrap:wrap;gap:8px}.bar input{flex:1 1 100%;font-size:16px}
.bar select,.bar button{flex:1;padding:10px 8px;font-size:13px}
#ftog{display:block}
.site{gap:10px 16px;padding:10px 12px;font-size:12px}.site div strong{font-size:13px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card .b{padding:8px}.card .t{font-size:13px}.tg{font-size:10px}
.card:hover{transform:none}
#modal{padding:0;overflow:auto;background:#000e}
#modal.show{display:block}
#mimg{padding:48px 8px 8px}
#mimg img{max-height:60vh}
.strip img{height:44px;max-height:44px}
#minfo{width:auto;margin:8px;border-radius:10px}
.close{position:fixed;right:12px;top:6px;z-index:10;font-size:34px;text-shadow:0 0 6px #000}
.empty{padding:30px}
}

const F={loc:new Set(),mat:new Set(),lit:new Set()},fav=new Set((()=>{try{return JSON.parse(localStorage.getItem("sistech_fav")||"[]")}catch(e){return[]}})());let onlyFav=false;
const $=s=>document.querySelector(s);
const cnt=(k)=>{const m={};D.spaces.forEach(s=>{(Array.isArray(s[k])?s[k]:[s[k]]).forEach(v=>m[v]=(m[v]||0)+1)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
function side(){const g=(t,k)=>'<h3>'+t+'</h3>'+cnt(k).map(([v,c])=>'<span class="chip'+(F[k].has(v)?' on':'')+'" data-k="'+k+'" data-v="'+v+'">'+v+'<small>'+c+'</small></span>').join('');
$('#side').innerHTML=g('위치','loc')+g('소재 / 사양 (AI 태그)','mat')+g('조명 방식 (AI 태그)','lit')+'<div class="note">※ 태그는 PDF 제목과 사양 텍스트에서 자동 추출한 예시입니다. 실제 시스템에서는 현장 수가 늘어도 같은 방식으로 자동 생성됩니다.</div>'}
$('#side').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const s=F[c.dataset.k],v=c.dataset.v;s.has(v)?s.delete(v):s.add(v);render()};
function render(){side();const q=$('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
let L=D.spaces.map((s,i)=>({...s,i})).filter(s=>{
 if(F.loc.size&&!F.loc.has(s.loc))return false;
 if(F.mat.size&&![...F.mat].every(v=>s.mat.includes(v)))return false;
 if(F.lit.size&&![...F.lit].every(v=>s.lit.includes(v)))return false;
 if(onlyFav&&!fav.has(s.i))return false;
 const hay=(s.n+' '+s.loc+' '+s.mat.join(' ')+' '+s.lit.join(' ')+' '+s.spec).toLowerCase();return q.every(w=>hay.includes(w))});
const so=$('#sort').value;if(so==1)L.sort((a,b)=>b.p.length-a.p.length);if(so==2)L.sort((a,b)=>a.n.localeCompare(b.n,'ko'));
$('#cnt').textContent=L.length+'개 공간 / '+D.site.pages+'페이지';
$('#grid').innerHTML=L.length?L.map(s=>'<div class="card" onclick="openM('+s.i+')"><span class="loc">'+s.loc+'</span>'+(s.p.length>1?'<span class="pg">'+s.p.length+'장</span>':'')+'<img src="'+D.thumbs[s.p[0]]+'"><div class="b"><div class="t"><span>'+s.n+'</span><span class="fav'+(fav.has(s.i)?' on':'')+'" onclick="event.stopPropagation();tf('+s.i+')">♥</span></div><div class="tags">'+s.mat.map(t=>'<span class="tg">'+t+'</span>').join('')+s.lit.map(t=>'<span class="tg l">'+t+'</span>').join('')+'</div></div></div>').join(''):'<div class="empty">조건에 맞는 사인이 없습니다.</div>'}
function tf(i){fav.has(i)?fav.delete(i):fav.add(i);try{localStorage.setItem("sistech_fav",JSON.stringify([...fav]))}catch(e){}render()}
$('#q').oninput=render;$('#sort').onchange=render;$('#favonly').onclick=()=>{onlyFav=!onlyFav;$('#favonly').style.background=onlyFav?'#ffe3ec':'#fff';render()};
const st=D.site;$('#site').innerHTML=[['현장',st.name],['구분',st.type],['건설사',st.client],['브랜드',st.brand],['시기',st.date],['디자인',st.designer],['원본',st.pdf]].map(([a,b])=>'<div><b>'+a+'</b><strong>'+b+'</strong></div>').join('');
let cur=0,pi=0;
function openM(i){cur=i;pi=0;showM();$('#modal').classList.add('show')}
function closeM(){$('#modal').classList.remove('show')}
function showM(){const s=D.spaces[cur];const pg=s.p[pi];
$('#mimg').innerHTML='<img src="'+D.thumbs[pg]+'"><div class="nav"><button onclick="mv(-1)">‹</button>'+(pi+1)+' / '+s.p.length+' (PDF p.'+pg+')<button onclick="mv(1)">›</button></div><div class="strip">'+s.p.map((p,k)=>'<img class="'+(k==pi?'on':'')+'" src="'+D.thumbs[p]+'" onclick="pi='+k+';showM()">').join('')+'</div>';
$('#minfo').innerHTML='<h2>'+s.n+'</h2><p style="margin:0">'+D.site.name+' · '+D.site.client+' · '+D.site.date+'</p><div class="row">사양 요약 (PDF 텍스트 기반)</div><p>'+s.spec+'</p><div class="row">소재</div><div>'+(s.mat.map(t=>'<span class="tg">'+t+'</span>').join('')||'-')+'</div><div class="row">조명</div><div>'+(s.lit.map(t=>'<span class="tg l">'+t+'</span>').join('')||'-')+'</div><div class="row">위치</div><p>'+(s.loc=='IN'?'실내':s.loc=='OUT'?'실외':'기타')+'</p><button class="btn" onclick="alert(\'샘플: 원본 PDF '+s.p.map(x=>'p.'+x).join(', ')+' 열기\')">원본 PDF 해당 페이지 열기</button><button class="btn o" onclick="alert(\'샘플: 선택 공간을 묶어 제안서용 PDF로 내려받기\')">제안서용으로 담기</button><button class="btn o" onclick="tf(cur);showM()">'+(fav.has(cur)?'♥ 즐겨찾기 해제':'♡ 즐겨찾기')+'</button>'}
function mv(d){const s=D.spaces[cur];pi=(pi+d+s.p.length)%s.p.length;showM()}
document.onkeydown=e=>{if(!$('#modal').classList.contains('show'))return;if(e.key=='Escape')closeM();if(e.key=='ArrowRight')mv(1);if(e.key=='ArrowLeft')mv(-1)};
render();
</script></body></html>
